[package]
name = "veilid-wrapper"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]
name = "veilid_wrapper"

[dependencies]
veilid-core = { path = "/home/seyon/dev/veilid-src/veilid-core", features = ["default-tokio"] }
jni = "0.22"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
